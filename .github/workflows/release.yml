name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/engine/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release tag against desktop version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Release tag '$env:RELEASE_TAG' does not match desktop version '$expected'."
          }

      - run: python -m pip install -r apps/engine/requirements-dev.txt
      - run: npm install
      - run: python -m ruff check apps/engine
      - run: python -m pytest apps/engine/tests -q
      - run: npm run typecheck
      - run: npm run build:web
      - shell: pwsh
        run: ./scripts/build-engine.ps1
      - shell: pwsh
        run: ./scripts/smoke-engine.ps1
      - run: npm run build:windows

      - name: Generate release manifest and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          $files = Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw 'No Windows installers were produced.' }
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content "$bundle/SHA256SUMS.txt"
          $engineVersion = (Get-Content apps/engine/app/__init__.py -Raw) -replace '.*__version__\s*=\s*"([^"]+)".*','$1'
          $desktopVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          @(
            "tag=$env:RELEASE_TAG",
            "commit=${{ github.sha }}",
            "desktop_version=$desktopVersion",
            "engine_version=$engineVersion",
            "generated_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content "$bundle/RELEASE-MANIFEST.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DeskAI-Work-Windows-${{ inputs.tag }}
          retention-days: 90
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/RELEASE-MANIFEST.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git tag --list $env:RELEASE_TAG | ForEach-Object { throw "Tag $env:RELEASE_TAG already exists." }
          $args = @('release','create',$env:RELEASE_TAG,'--target','${{ github.sha }}','--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $args += '--prerelease' }
          $assets = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          $args += $assets.FullName
          $args += 'apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt'
          $args += 'apps/desktop/src-tauri/target/release/bundle/RELEASE-MANIFEST.txt'
          gh @args
