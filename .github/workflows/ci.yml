name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/engine/requirements-dev.txt
      - run: python -m pip install -r apps/engine/requirements-dev.txt
      - run: python -m ruff check apps/engine
      - run: python -m pytest apps/engine/tests -q

  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web

  windows-native:
    runs-on: windows-latest
    needs: [engine, desktop-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/engine/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm install
      - shell: pwsh
        run: ./scripts/build-engine.ps1
      - shell: pwsh
        run: ./scripts/smoke-engine.ps1
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: DeskAI-Work-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
